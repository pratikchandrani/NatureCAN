# Basic Apache Security Settings
ServerTokens Prod
ServerSignature Off

# Disable TRACE method
TraceEnable Off

# Block access to hidden files (.git, .env, etc.)
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

# Block access to config PHP files directly
<FilesMatch "^(config|db_config|constants)\.php$">
    <If "%{REQUEST_URI} =~ m#^/(config|db_config|constants)\.php$#">
        Require all denied
    </If>
</FilesMatch>
